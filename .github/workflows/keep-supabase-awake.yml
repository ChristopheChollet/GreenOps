name: Keep Supabase Awake

# Free-tier Supabase projects pause after ~7 days without API activity.
# This pings the Auth health endpoint every 3 days so the demo never goes
# cold before a recruiter visits it.

on:
  schedule:
    - cron: "0 9 */3 * *" # every 3 days at 09:00 UTC
  workflow_dispatch: {} # allow manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (Auth health check)
        run: |
          # /auth/v1/health only needs the publishable (anon) key on the
          # `apikey` header — no `Authorization` header. Sending the key as a
          # Bearer token makes the gateway try to parse it as a JWT and fail,
          # since publishable/secret keys are not JWTs (see Supabase API
          # keys docs). The bare `/rest/v1/` root also doesn't work here: it
          # requires a *secret* key, not the publishable one.
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 400 ]; then
            echo "::warning::Supabase returned $status — project may need manual restore."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
